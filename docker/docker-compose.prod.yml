name: apulse

services:
  web:
    container_name: apulse-web
    build:
      context: ..
      dockerfile: docker/web-prod.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
    depends_on:
      - api
    restart: always

  api:
    container_name: apulse-api
    build:
      context: ..
      dockerfile: docker/api-prod.Dockerfile
    ports:
      - '${API_PORT:-3001}:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-apulse-images}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}

    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

    restart: always

  db:
    container_name: apulse-db
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  minio:
    container_name: apulse-minio
    image: ${MINIO_IMAGE}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_prod_data:/data
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    container_name: apulse-minio-init
    image: ${MINIO_CLIENT_IMAGE}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-apulse-images}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set apulse http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing apulse/$$MINIO_BUCKET &&
        mc anonymous set download apulse/$$MINIO_BUCKET
    restart: 'no'

volumes:
  postgres_prod_data:
  minio_prod_data:
