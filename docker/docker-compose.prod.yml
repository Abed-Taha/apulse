name: apulse

services:
  web:
    container_name: apulse-web
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
    depends_on:
      - api
    restart: always

  api:
    container_name: apulse-api
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
      target: prod
    ports:
      - '${API_PORT:-3001}:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    container_name: apulse-db
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

volumes:
  postgres_prod_data:
